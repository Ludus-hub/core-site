<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #00C9FF;
            --bg:     #0a0a0a;
        }

        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

        #loading-screen {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }

        .ld-spinner {
            width: 38px; height: 38px;
            border: 3px solid rgba(0,201,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ld-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
        }

        #error-screen {
            position: fixed; inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 40px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #error-screen h2 { color: #ff6b6b; font-size: 1.4rem; }
        #error-screen p  { color: rgba(255,255,255,0.5); font-size: 13px; max-width: 420px; line-height: 1.6; }
        #error-screen code {
            display: inline-block;
            background: rgba(255,255,255,0.06);
            border-radius: 5px;
            padding: 2px 8px;
            font-size: 12px;
            color: var(--accent);
        }

        #proxy-frame {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            border: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="ld-spinner"></div>
        <div class="ld-text">Connecting to proxy…</div>
    </div>

    <div id="error-screen">
        <h2>⚠ Proxy failed to load</h2>
        <p id="error-msg">An unknown error occurred.</p>
        <p>Make sure <code>/p/scram/scramjet.all.js</code> is deployed and the Wisp server is reachable.</p>
    </div>

    <iframe id="proxy-frame"
            allowfullscreen
            allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *;
                   storage-access *; clipboard-read *; clipboard-write *">
    </iframe>

    <script src="/p/scram/scramjet.all.js"></script>

    <script>
        const TARGET_URL = 'https://instagram.com';

        const frame       = document.getElementById('proxy-frame');
        const loadScreen  = document.getElementById('loading-screen');
        const errorScreen = document.getElementById('error-screen');
        const errorMsg    = document.getElementById('error-msg');

        function showError(msg) {
            loadScreen.classList.add('hidden');
            errorScreen.style.display = 'flex';
            errorMsg.textContent = msg;
        }

        (async () => {
            try {
                if (typeof $scramjetLoadController !== 'function') {
                    throw new Error('scramjet.all.js not loaded — check /p/scram/ deployment.');
                }

                const { ScramjetController } = $scramjetLoadController();

                const scramjet = new ScramjetController({
                    prefix: '/scramjet/',
                    wisp: 'wss://wisp.mercurywork.shop/',
                    files: {
                        wasm: '/p/scram/scramjet.wasm.wasm',
                        all:  '/p/scram/scramjet.all.js',
                        sync: '/p/scram/scramjet.sync.js',
                    }
                });

                await scramjet.init();

                const proxyUrl = location.origin + scramjet.encodeUrl(TARGET_URL);

                // ─────────────────────────────────────────────────────────────────
                // FIX A: Wisp keep-alive.
                //
                // The Wisp WebSocket connection goes idle while the user types their
                // credentials, and the public server drops it after ~15–30s of
                // silence.  When they click "Log in" the POST can't go through
                // because the WS is already dead → infinite spinner.
                //
                // Every 12 seconds we fire a tiny proxied fetch (instagram favicon)
                // just to produce traffic on the WS and reset the server-side idle
                // timer.  The favicon is <1 KB and is cached by the browser after
                // the first hit, so it costs almost nothing.
                // ─────────────────────────────────────────────────────────────────
                const keepAliveUrl = location.origin +
                    scramjet.encodeUrl('https://www.instagram.com/favicon.ico');

                const keepAlive = setInterval(() => {
                    fetch(keepAliveUrl, { cache: 'no-store', mode: 'no-cors' })
                        .catch(() => { /* ignore — just keeping WS warm */ });
                }, 12000);

                // ─────────────────────────────────────────────────────────────────
                // FIX B: window.top isolation.
                //
                // Instagram's post-login code sometimes navigates window.top (the
                // real browser top = this insta.html page) to instagram.com directly,
                // bypassing the proxy.  On school/work networks where instagram.com
                // is blocked that navigation silently hangs → spinner never clears.
                //
                // After every page load inside the iframe we try to shadow window.top
                // so it points back at the iframe's own window, forcing navigation to
                // stay within the proxied frame where Scramjet can rewrite it.
                //
                // window.top is non-configurable in most browsers, so the define will
                // throw and we fall through — but it works in some environments and
                // is worth trying.
                // ─────────────────────────────────────────────────────────────────
                function applyTopIsolation() {
                    try {
                        Object.defineProperty(frame.contentWindow, 'top', {
                            get: () => frame.contentWindow,
                            configurable: true,
                        });
                    } catch (_) {
                        // Non-configurable in this browser — skip.
                    }
                }

                frame.addEventListener('load', () => {
                    loadScreen.classList.add('hidden');
                    frame.style.display = 'block';

                    applyTopIsolation();

                    try {
                        const framePath =
                            frame.contentWindow.location.pathname +
                            frame.contentWindow.location.search +
                            frame.contentWindow.location.hash;

                        if (framePath === 'about:blank' || framePath === '/') return;

                        let realUrl;
                        if (typeof scramjet.decodeUrl === 'function') {
                            const encodedPart = framePath.split('/scramjet/')[1];
                            if (encodedPart) realUrl = scramjet.decodeUrl(encodedPart);
                        }

                        if (!realUrl) return;

                        const parsedUrl = new URL(realUrl);

                        const allowedDomains = [
                            'instagram.com',
                            'cdninstagram.com',
                            'facebook.com',
                            'fb.com',
                            'fbsbx.com',
                        ];

                        const isAllowed = allowedDomains.some(d =>
                            parsedUrl.hostname === d ||
                            parsedUrl.hostname.endsWith('.' + d)
                        );

                        if (!isAllowed) {
                            console.warn(`[Domain Lock] Blocked → ${parsedUrl.hostname}`);
                            frame.src = proxyUrl;
                        }

                    } catch (err) {
                        console.error('[Domain Lock]', err);
                    }
                });

                setTimeout(() => {
                    if (frame.style.display !== 'block') {
                        loadScreen.classList.add('hidden');
                        frame.style.display = 'block';
                    }
                }, 8000);

                frame.src = proxyUrl;

            } catch (err) {
                console.error('[simple-proxy] init failed:', err);
                showError(err.message || String(err));
            }
        })();
    </script>
</body>
</html>
