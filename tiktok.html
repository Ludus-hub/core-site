<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --accent: #00C9FF; --bg: #0a0a0a; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

        #gate {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 18px; z-index: 100;
            transition: opacity 0.4s ease;
        }
        #gate.hidden { opacity: 0; pointer-events: none; }

        .spin {
            width: 38px; height: 38px;
            border: 3px solid rgba(0,201,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: rot 0.7s linear infinite;
        }
        @keyframes rot { to { transform: rotate(360deg); } }

        .info {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: rgba(255,255,255,0.5); font-size: 13px;
        }

        #fault {
            position: fixed; inset: 0; background: var(--bg);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 14px; padding: 40px; text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #fault h2 { color: #ff6b6b; font-size: 1.4rem; }
        #fault p  { color: rgba(255,255,255,0.5); font-size: 13px; max-width: 420px; line-height: 1.6; }
        #fault code {
            display: inline-block; background: rgba(255,255,255,0.06);
            border-radius: 5px; padding: 2px 8px; font-size: 12px; color: var(--accent);
        }

        #tunnel {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            border: none; display: none;
        }
    </style>
</head>
<body>

    <div id="gate">
        <div class="spin"></div>
        <div class="info">Connecting to conduit…</div>
    </div>

    <div id="fault">
        <h2>⚠ Conduit failed to load</h2>
        <p id="fault-msg">An unknown error occurred.</p>
        <p>Make sure <code>/p/scram/scramjet.all.js</code> is deployed and the Wisp server is reachable.</p>
    </div>

    <iframe id="tunnel"
        allowfullscreen
        allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *; clipboard-read *; clipboard-write *">
    </iframe>

    <script src="/p/scram/scramjet.all.js"></script>

    <script>
        // Destination — encoded to avoid plain-text detection
        const _d = atob('aHR0cHM6Ly90aWt0b2suY29t'); // https://tiktok.com

        const frame      = document.getElementById('tunnel');
        const gate       = document.getElementById('gate');
        const fault      = document.getElementById('fault');
        const faultMsg   = document.getElementById('fault-msg');
        const statusText = document.querySelector('.info');

        function showFault(msg) {
            gate.classList.add('hidden');
            fault.style.display = 'flex';
            faultMsg.textContent = msg;
        }

        (async () => {
            try {
                if (typeof $scramjetLoadController !== 'function') {
                    throw new Error('Core bundle not loaded — check /p/scram/ deployment.');
                }

                const { ScramjetController } = $scramjetLoadController();
                const _c = new ScramjetController({
                    prefix: '/scramjet/',
                    wisp: 'wss://nebulaproxy.io/wisp/',
                    files: {
                        wasm: '/p/scram/scramjet.wasm.wasm',
                        all:  '/p/scram/scramjet.all.js',
                        sync: '/p/scram/scramjet.sync.js',
                    }
                });

                if ('serviceWorker' in navigator) {
                    statusText.textContent = 'Registering relay…';
                    await navigator.serviceWorker.register('/sw.js', { scope: '/' });
                    statusText.textContent = 'Waiting for relay…';
                    await navigator.serviceWorker.ready;
                }
                statusText.textContent = 'Initialising conduit…';
                await _c.init();

                const dest = location.origin + _c.encodeUrl(_d);

                frame.addEventListener('load', () => {
                    gate.classList.add('hidden');
                    frame.style.display = 'block';
                }, { once: true });

                setTimeout(() => {
                    if (frame.style.display !== 'block') {
                        gate.classList.add('hidden');
                        frame.style.display = 'block';
                    }
                }, 8000);

                frame.src = dest;

            } catch (err) {
                console.error('[ludus] init error:', err);
                showFault(err.message || String(err));
            }
        })();
    </script>
</body>
</html>
