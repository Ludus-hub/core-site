<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus Stream</title>

    <style>
        :root {
            --bg-base: #040404;
            --bg-elevated: #0a0a0a;
            --bg-card: #111111;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #00C9FF; /* Mathmaster Cyan */
            --accent-glow: rgba(0, 201, 255, 0.6);
            --gradient: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Navbar --- */
        .navbar {
            position: fixed;
            top: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 100;
            transition: background 0.3s, backdrop-filter 0.3s;
        }
        .navbar.scrolled { 
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        
        .brand { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            cursor: pointer; 
        }
        .brand span {
            font-size: 28px; 
            font-weight: 900; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            background: var(--gradient);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; gap: 20px; font-size: 15px; font-weight: 500; }
        .nav-links a { color: var(--text-muted); text-decoration: none; cursor: pointer; transition: color var(--transition); }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        /* Search Bar */
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .search-box {
            position: relative;
            background: rgba(30, 30, 30, 0.6);
            border-radius: 24px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            transition: var(--transition);
            gap: 10px;
        }
        .search-box:focus-within { 
            border-color: var(--accent); 
            box-shadow: 0 0 15px rgba(0, 201, 255, 0.2); 
            background: rgba(10, 10, 10, 0.8);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            outline: none;
            width: 150px;
            transition: width 0.3s;
        }
        .search-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .search-box input:focus { width: 220px; }

        /* Live Search Dropdown */
        .search-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            width: 400px;
            background: rgba(8, 8, 8, 0.97);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 201, 255, 0.25);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 70px rgba(0,0,0,0.95), 0 0 40px rgba(0,201,255,0.06);
            z-index: 2000;
            display: none;
            animation: dropIn 0.18s ease;
        }
        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .search-dropdown.visible { display: block; }
        .search-dropdown-header {
            padding: 10px 14px 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(0,201,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .search-dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 14px;
            cursor: pointer;
            transition: background 0.12s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .search-dropdown-item:last-child { border-bottom: none; }
        .search-dropdown-item:hover { background: rgba(0,201,255,0.07); }
        .search-dropdown-item:hover .search-item-title { color: var(--accent); }
        .search-drop-thumb {
            width: 78px;
            height: 44px;
            object-fit: cover;
            border-radius: 6px;
            background: #1a1a1a;
            flex-shrink: 0;
        }
        .search-drop-placeholder {
            width: 78px;
            height: 44px;
            border-radius: 6px;
            background: #1a1a1a;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 18px;
        }
        .search-item-info { flex: 1; min-width: 0; }
        .search-item-title {
            font-size: 13.5px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.12s;
        }
        .search-item-meta {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 3px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .search-meta-badge {
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .search-meta-badge.movie { color: #92FE9D; }
        .search-meta-badge.tv { color: #00C9FF; }
        .search-drop-loading, .search-drop-empty {
            padding: 22px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13.5px;
        }
        .search-drop-loading { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .search-drop-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(0,201,255,0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .search-see-all {
            padding: 12px 14px;
            text-align: center;
            font-size: 13px;
            color: var(--accent);
            cursor: pointer;
            border-top: 1px solid rgba(255,255,255,0.06);
            transition: background 0.15s;
            font-weight: 600;
        }
        .search-see-all:hover { background: rgba(0,201,255,0.07); }

        /* --- Hero Section --- */
        .hero {
            position: relative;
            height: 85vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding-bottom: 100px;
        }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-base) 0%, transparent 60%),
                        linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 50%);
        }
        .hero-content {
            position: relative;
            z-index: 10;
            margin-left: 40px;
            max-width: 700px;
        }
        .hero-title { font-size: 4rem; font-weight: 800; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .hero-desc { font-size: 1.2rem; line-height: 1.5; margin-bottom: 25px; color: #eee; text-shadow: 1px 1px 3px black; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-buttons { display: flex; gap: 15px; }
        
        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-play { background: var(--text-main); color: black; }
        .btn-play:hover { box-shadow: 0 0 20px rgba(255,255,255,0.4); }
        .btn-info { background: rgba(255, 255, 255, 0.2); color: white; backdrop-filter: blur(5px); }
        .btn-info:hover { background: rgba(255, 255, 255, 0.3); }

        /* --- Rows & Carousels --- */
        .row { margin-left: 40px; margin-bottom: 50px; position: relative; }
        .row h2 { font-size: 1.4rem; margin-bottom: 15px; font-weight: 600; color: #e5e5e5; }
        
        .row-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .scroll-btn {
            position: absolute;
            top: 0; bottom: 0;
            width: 40px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s, background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .row-wrapper:hover .scroll-btn { opacity: 1; }
        .scroll-btn:hover { background: rgba(0,0,0,0.8); color: var(--accent); }
        .scroll-btn.left { left: 0; }
        .scroll-btn.right { right: 0; }

        .row-posters {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px 0;
            scroll-behavior: smooth;
        }
        .row-posters::-webkit-scrollbar { display: none; }

        .movie-card {
            position: relative;
            width: 280px;
            height: 157px; /* 16:9 aspect ratio */
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            flex-shrink: 0;
            overflow: hidden;
            background: var(--bg-card);
        }
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
        }
        .card-title {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 1px 1px 2px black;
        }
        .movie-card:hover { 
            transform: scale(1.08); 
            z-index: 9; 
            box-shadow: 0 0 20px var(--accent-glow); 
            border: 1px solid var(--accent);
        }

        /* --- Views --- */
        .view-container { display: none; padding-top: 80px; min-height: 100vh; }
        .view-container.active { display: block; }

        /* --- Catalog/Grid View (My List) --- */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            padding: 40px;
        }

        /* --- Details View --- */
        .details-backdrop {
            position: absolute; top: 0; left: 0; width: 100%; height: 80vh;
            background-size: cover; background-position: top center;
            z-index: -1;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            opacity: 0.3;
        }
        
        .details-content { padding: 60px; max-width: 1400px; margin: 0 auto; }
        .details-title { font-size: 4.5rem; font-weight: 800; margin-bottom: 15px; letter-spacing: 1px; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .details-meta { display: flex; gap: 20px; color: var(--text-muted); font-size: 1.1rem; margin-bottom: 25px; align-items: center; }
        .rating { color: var(--accent); font-weight: bold; text-shadow: 0 0 10px var(--accent-glow); }
        .details-overview { max-width: 900px; line-height: 1.7; margin-bottom: 40px; font-size: 1.3rem; color: #ddd; }
        
        .details-actions { display: flex; gap: 20px; margin-bottom: 60px; }
        .btn-circle {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(20,20,20,0.6); border: 2px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center;
            color: white; cursor: pointer; transition: all var(--transition);
        }
        .btn-circle:hover, .btn-circle.active { 
            border-color: var(--accent); 
            color: var(--accent); 
            box-shadow: 0 0 15px var(--accent-glow); 
            background: rgba(0, 201, 255, 0.1);
        }
        
        /* Actors Grid */
        .section-title { font-size: 1.8rem; color: #fff; margin-bottom: 25px; border-left: 4px solid var(--accent); padding-left: 15px; }
        .actors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }
        .actor-card {
            display: flex; align-items: center; gap: 15px;
            background: var(--bg-card); padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        .actor-card:hover {
            border-color: rgba(0,201,255,0.45);
            box-shadow: 0 4px 18px rgba(0,201,255,0.12);
            transform: translateY(-2px);
        }
        .actor-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; }
        .actor-info { display: flex; flex-direction: column; min-width: 0; }
        .actor-name { font-size: 1.1rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actor-char { font-size: 0.9rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actor-card-hint { font-size: 10px; color: var(--accent); opacity: 0.6; margin-top: 3px; }

        /* ── Actor Profile Modal ── */
        #actor-modal {
            display: none;
            position: fixed; inset: 0;
            z-index: 1500;
            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #actor-modal.open { display: flex; }
        .actor-modal-card {
            background: #0d0d0d;
            border: 1px solid rgba(0,201,255,0.18);
            border-radius: 16px;
            width: 100%;
            max-width: 700px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 24px 80px rgba(0,0,0,0.95), 0 0 40px rgba(0,201,255,0.04);
            animation: dropIn 0.2s ease;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,201,255,0.25) transparent;
        }
        .actor-modal-card::-webkit-scrollbar { width: 4px; }
        .actor-modal-card::-webkit-scrollbar-thumb { background: rgba(0,201,255,0.25); border-radius: 4px; }
        .actor-modal-header {
            display: flex; gap: 22px; padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }
        .actor-modal-photo {
            width: 100px; height: 100px; border-radius: 50%;
            object-fit: cover; flex-shrink: 0;
            border: 2px solid rgba(0,201,255,0.28);
            background: #1a1a1a;
        }
        .actor-modal-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .actor-modal-name { font-size: 1.55rem; font-weight: 800; }
        .actor-modal-born { font-size: 12.5px; color: var(--text-muted); }
        .actor-modal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .actor-modal-tag {
            font-size: 10.5px; font-weight: 600;
            background: rgba(0,201,255,0.07);
            border: 1px solid rgba(0,201,255,0.22);
            border-radius: 4px; padding: 2px 9px;
            color: var(--accent);
        }
        .actor-modal-close {
            position: absolute; top: 14px; right: 14px;
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.11);
            color: white; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.18s;
        }
        .actor-modal-close:hover { background: rgba(255,255,255,0.16); }
        .actor-modal-bio {
            padding: 16px 24px;
            font-size: 13.5px; line-height: 1.7; color: #bbb;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .actor-bio-text {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .actor-bio-text.expanded { -webkit-line-clamp: unset; display: block; }
        .actor-bio-toggle {
            display: inline-block; margin-top: 8px;
            font-size: 12px; color: var(--accent);
            cursor: pointer; font-weight: 600;
        }
        .actor-modal-section {
            font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: var(--text-muted);
            padding: 14px 24px 6px;
        }
        .actor-credits-row {
            display: flex; gap: 11px; overflow-x: auto;
            padding: 4px 24px 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,201,255,0.18) transparent;
        }
        .actor-credits-row::-webkit-scrollbar { height: 3px; }
        .actor-credits-row::-webkit-scrollbar-thumb { background: rgba(0,201,255,0.2); border-radius: 3px; }
        .actor-credit-card {
            flex-shrink: 0; width: 120px; cursor: pointer;
            transition: transform 0.18s;
        }
        .actor-credit-card:hover { transform: translateY(-3px); }
        .actor-credit-thumb {
            width: 120px; height: 68px;
            border-radius: 6px; object-fit: cover;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.05);
            display: block;
        }
        .actor-credit-title {
            font-size: 11px; font-weight: 600; color: #ddd;
            margin-top: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .actor-credit-year { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .actor-modal-loading {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; padding: 52px 24px;
            color: var(--text-muted); font-size: 14px;
        }

        /* --- Episodes Section --- */
        .episodes-section { margin-bottom: 60px; }
        .episodes-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .season-selector {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .season-select {
            appearance: none;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 8px 38px 8px 16px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .season-select:hover, .season-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0,201,255,0.2);
        }
        .season-select option { background: #111; }
        .season-selector::after {
            content: '▾';
            position: absolute;
            right: 12px;
            color: var(--accent);
            font-size: 14px;
            pointer-events: none;
        }

        .episodes-grid {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 6px 0 16px;
            scroll-behavior: smooth;
        }
        .episodes-grid::-webkit-scrollbar { height: 4px; }
        .episodes-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 4px; }
        .episodes-grid::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; opacity: 0.5; }

        .episode-card {
            flex-shrink: 0;
            width: 320px;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .episode-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 6px 24px rgba(0,201,255,0.2);
        }
        .episode-card.active-ep {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent), 0 6px 24px rgba(0,201,255,0.25);
        }
        .ep-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #1a1a1a;
            overflow: hidden;
        }
        .ep-thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s;
        }
        .ep-thumb .ep-play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0);
            transition: background 0.2s;
        }
        .episode-card:hover .ep-play-overlay { background: rgba(0,0,0,0.45); }
        .ep-play-overlay svg { opacity: 0; transform: scale(0.85); transition: opacity 0.2s, transform 0.2s; }
        .episode-card:hover .ep-play-overlay svg { opacity: 1; transform: scale(1); }
        .ep-runtime {
            position: absolute;
            bottom: 6px; right: 8px;
            background: rgba(0,0,0,0.75);
            color: #ccc;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .ep-body { padding: 14px 16px; }
        .ep-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .ep-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ep-meta {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .ep-desc {
            font-size: 12.5px;
            color: #999;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .episodes-loading {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 14px;
        }
        .ep-spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(0,201,255,0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Player View --- */
        #player-view {
            position: fixed; inset: 0; background: black; z-index: 1000; display: none;
            flex-direction: column;
        }
        .player-topbar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 16px 24px;
            display: flex; justify-content: space-between; align-items: center; z-index: 1010;
            background: linear-gradient(to bottom, rgba(0,0,0,0.92), transparent);
            transition: opacity 0.5s;
        }
        /* When idle, fade to barely-visible — but keep pointer-events so controls stay clickable */
        #player-view.idle .player-topbar { opacity: 0.12; }
        #player-view.idle .player-topbar:hover { opacity: 1; transition: opacity 0.15s; }
        #player-view.idle .servers-panel.open { opacity: 1; pointer-events: all; }
        #player-view:has(.servers-panel.open) .player-topbar { opacity: 1 !important; }
        /* Wide strip that captures mouse re-entry when iframe swallows mouse events */
        #player-topbar-trigger {
            position: absolute; top: 0; left: 0; width: 100%; height: 200px;
            z-index: 1005; pointer-events: all;
        }
        .embed-container { width: 100%; height: 100%; position: relative; }

        /* ── Player Loader ── */
        .player-loader {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            background: rgba(4, 4, 4, 0.92);
            backdrop-filter: blur(6px);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .player-loader.fade-out { opacity: 0; }
        .player-loader-spinner {
            width: 38px; height: 38px; border-radius: 50%;
            border: 2.5px solid rgba(0, 201, 255, 0.18);
            border-top-color: var(--accent);
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .player-loader-label {
            font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.45);
        }



        /* --- Server Controls Group --- */
        .server-controls {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Unified Servers Button */
        .show-more-btn {
            height: 30px;
            padding: 0 11px;
            background: rgba(0, 201, 255, 0.07);
            border: 1px solid rgba(0,201,255,0.35);
            border-radius: 7px;
            color: var(--accent);
            font-weight: 600;
            font-size: 11.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 180px;
        }
        .show-more-btn:hover {
            background: rgba(0, 201, 255, 0.16);
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0,201,255,0.15);
        }
        .show-more-btn .srv-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .show-more-btn .chevron {
            font-size: 8px;
            opacity: 0.7;
            flex-shrink: 0;
            transition: transform 0.2s;
            display: inline-block;
        }
        .show-more-btn.open .chevron { transform: rotate(180deg); }
        /* Active tile highlight in servers panel */
        .server-tile.active-server {
            border-color: var(--accent);
            background: rgba(0,201,255,0.1);
        }
        .server-tile.active-server .s-name { color: var(--accent); }

        /* Servers Panel */
        .servers-panel {
            display: none;
            position: fixed;
            top: 52px;
            right: 16px;
            width: 340px;
            max-height: 52vh;
            background: #0d0d0d;
            border: 1px solid rgba(0, 201, 255, 0.22);
            border-radius: 10px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.95), 0 0 24px rgba(0,201,255,0.05);
            overflow: hidden;
            flex-direction: column;
            z-index: 2000;
            animation: panelSlide 0.18s ease;
        }
        .servers-panel.open { display: flex; }

        @keyframes panelSlide {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Conduit controls inside panel */
        .sandbox-controls {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
        }
        .sandbox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: default;
        }
        .sandbox-header h4 {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        .sandbox-header .sandbox-hint {
            font-size: 10px;
            color: #92FE9D;
        }
        .sandbox-toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .sandbox-chip { display:none; }
        .sandbox-dot { display:none; }
        .sandbox-apply-btn { display:none; }

        /* Warning Banner */
        .servers-warning {
            background: rgba(220, 50, 20, 0.08);
            border-bottom: 1px solid rgba(230, 80, 40, 0.25);
            padding: 6px 10px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        .servers-warning svg { flex-shrink: 0; margin-top: 1px; width: 12px; height: 12px; }
        .servers-warning .warn-body p { font-size: 10px; line-height: 1.4; color: #ffb090; }
        .servers-warning .warn-body p + p { margin-top: 2px; }
        .servers-warning strong { color: #ff7755; }

        /* Panel Header */
        .servers-header {
            padding: 8px 10px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .servers-header h3 {
            font-size: 11px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }
        .servers-search {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px;
            padding: 4px 8px;
            color: white;
            font-size: 11px;
            outline: none;
            transition: border-color 0.2s;
        }
        .servers-search::placeholder { color: rgba(255,255,255,0.3); }
        .servers-search:focus { border-color: var(--accent); }
        .modal-close-btn {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .modal-close-btn:hover { background: rgba(255,255,255,0.15); }

        /* Server Grid */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 5px;
            padding: 6px 8px 8px;
            overflow-y: auto;
        }
        .servers-grid::-webkit-scrollbar { width: 3px; }
        .servers-grid::-webkit-scrollbar-track { background: transparent; }
        .servers-grid::-webkit-scrollbar-thumb { background: rgba(0,201,255,0.3); border-radius: 3px; }

        .server-tile {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 6px;
            padding: 6px 8px;
            cursor: pointer;
            transition: all 0.12s;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .server-tile:hover {
            background: rgba(0, 201, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 6px rgba(0,201,255,0.1);
        }
        .server-tile .s-name {
            font-weight: 600;
            font-size: 11px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .server-tile .s-domain {
            font-size: 9px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .server-tile .s-badge {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 1px;
        }
        .server-tile .s-badge-big3    { color: var(--accent); }
        .server-tile .s-badge-rec     { color: #92FE9D; }
        .server-tile .s-badge-notreq  { color: #ff7755; }
        .server-no-results {
            grid-column: 1/-1;
            text-align: center;
            color: var(--text-muted);
            padding: 16px 0;
            font-size: 12px;
        }

        /* --- Continue Watching --- */
        .cw-card { position: relative; }
        .cw-progress-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: rgba(255,255,255,0.12);
            z-index: 6;
        }
        .cw-progress-fill {
            height: 100%;
            background: var(--gradient);
            border-radius: 0 2px 2px 0;
            transition: width 0.4s ease;
        }
        .cw-time-ago {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0,0,0,0.72);
            color: rgba(255,255,255,0.65);
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            z-index: 6;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .cw-ep-badge {
            position: absolute;
            top: 8px; left: 8px;
            background: rgba(0,201,255,0.85);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            z-index: 6;
            letter-spacing: 0.3px;
        }
        .cw-remove-btn {
            position: absolute;
            top: 30px; right: 8px;
            width: 22px; height: 22px;
            background: rgba(0,0,0,0.72);
            color: rgba(255,255,255,0.55);
            border: none; cursor: pointer;
            border-radius: 50%;
            font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
        }
        .cw-card:hover .cw-remove-btn { opacity: 1; }
        .cw-remove-btn:hover { color: #ff5555; }

    </style>
</head>

                <input type="text" id="searchInput" placeholder="Search titles..."

            </button>

    <script>
        
        const TMDB_KEY = 'e55425032d3d0f371fc776f302e7c09b';
        const BASE_IMG  = 'https://image.tmdb.org/t/p/original';
        const W1280_IMG = 'https://image.tmdb.org/t/p/w1280';
        const W500_IMG  = 'https://image.tmdb.org/t/p/w500';

        
        let currentItem = null;
        let currentNav = 'home';
        let currentActiveServerId = 'yapgrid';

        // --- Continue Watching ---
        const CW_KEY = 'ludus_continue';
        let _cwTimer = null;
        let _cwSessionStart = null;
        let _cwSessionSeconds = 0;


        // --- UI Interactions ---
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) document.getElementById('navbar').classList.add('scrolled');
            else document.getElementById('navbar').classList.remove('scrolled');
        });

        function scrollRow(elementId, amount) {
            const container = document.getElementById(elementId);
            container.scrollBy({ left: amount, behavior: 'smooth' });
        }

        // Search logic
        async function handleSearch(query) {
            if(query.length < 2) return;
            navigate('search');
            document.getElementById('catalog-title').innerText = `Results for "${query}"`;
            const data = await fetchAPI(`/search/multi?query=${encodeURIComponent(query)}`);
            renderGrid(data.results);
        }

        // Live search dropdown with debounce
        let _searchTimer = null;
        async function handleSearchInput(query) {
            clearTimeout(_searchTimer);
            const dropdown = document.getElementById('searchDropdown');
            if (query.length < 2) { closeSearchDropdown(); return; }

            dropdown.innerHTML = '<div class="search-drop-loading"><div class="search-drop-spinner"></div> Searching…</div>';
            dropdown.classList.add('visible');

            _searchTimer = setTimeout(async () => {
                try {
                    const data = await fetchAPI(`/search/multi?query=${encodeURIComponent(query)}&page=1`);
                    const results = (data.results || [])
                        .filter(item => (item.media_type === 'movie' || item.media_type === 'tv') && (item.backdrop_path || item.poster_path))
                        .slice(0, 8);

                    if (results.length === 0) {
                        dropdown.innerHTML = '<div class="search-drop-empty">No results found</div>';
                        return;
                    }

                    dropdown.innerHTML =
                        '<div class="search-dropdown-header">Suggestions</div>' +
                        results.map(item => {
                            const thumb = item.backdrop_path ? `${W500_IMG}${item.backdrop_path}` : (item.poster_path ? `${W500_IMG}${item.poster_path}` : '');
                            const title = item.title || item.name;
                            const year = (item.release_date || item.first_air_date || '').split('-')[0];
                            const typeLabel = item.media_type === 'tv' ? 'Series' : 'Movie';
                            const rating = item.vote_average ? `★ ${item.vote_average.toFixed(1)}` : '';
                            return `
                            <div class="search-dropdown-item" onclick="loadDetails(${item.id},'${item.media_type}'); closeSearchDropdown(); document.getElementById('searchInput').value='${title.replace(/'/g,"\\'")}'; ">
                                ${thumb
                                    ? `<img class="search-drop-thumb" src="${thumb}" alt="${title}" onerror="this.style.display='none'">`
                                    : `<div class="search-drop-placeholder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M17 7h5M2 17h5M17 17h5"/></svg></div>`}
                                <div class="search-item-info">
                                    <div class="search-item-title">${title}</div>
                                    <div class="search-item-meta">
                                        <span class="search-meta-badge ${item.media_type}">${typeLabel}</span>
                                        ${year ? `<span>${year}</span>` : ''}
                                        ${rating ? `<span style="color:var(--accent)">${rating}</span>` : ''}
                                    </div>
                                </div>
                            </div>`;
                        }).join('') +
                        `<div class="search-see-all" onclick="handleSearch('${query.replace(/'/g,"\\'")}'); closeSearchDropdown();">See all results for "${query}" →</div>`;
                } catch(err) {
                    dropdown.innerHTML = '<div class="search-drop-empty">Search unavailable</div>';
                }
            }, 280);
        }

        function closeSearchDropdown() {
            const dropdown = document.getElementById('searchDropdown');
            if (dropdown) { dropdown.classList.remove('visible'); dropdown.innerHTML = ''; }
        }

        function renderGrid(items) {
            const container = document.getElementById('catalog-grid');
            container.innerHTML = items.map(item => {
                if(!item.backdrop_path && !item.poster_path) return '';
                const img = item.backdrop_path ? W500_IMG+item.backdrop_path : W500_IMG+item.poster_path;
                return `
                <div class="movie-card" style="width:100%; height:auto; aspect-ratio:16/9" onclick="loadDetails(${item.id || item.tmdbId}, '${item.media_type || 'movie'}')">

        // --- Data Fetching ---
        const _apiCache = new Map();
        const _CACHE_TTL = 5 * 60 * 1000; // 5 minutes

        async function fetchAPI(endpoint) {
            const url = `https://api.themoviedb.org/3${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${TMDB_KEY}`;
            const hit = _apiCache.get(url);
            if (hit && (Date.now() - hit.ts < _CACHE_TTL)) return hit.data;
            const res = await fetch(url);
            const data = await res.json();
            _apiCache.set(url, { data, ts: Date.now() });
            return data;
        }

        // Global dedup set — cleared each time a new home/category page loads
        let seenItemIds = new Set();

        function createRowHTML(title, id) {
            return `
            <div class="row">

        // Deferred row loader — fires populateRow only when the row scrolls near the viewport.
        // Falls back to immediate load if IntersectionObserver isn't available.
        function deferPopulateRow(endpoint, elementId, forceType = null) {
            const el = document.getElementById(elementId);
            if (!el) return;
            if (!('IntersectionObserver' in window)) {
                populateRow(endpoint, elementId, forceType);
                return;
            }
            const observer = new IntersectionObserver((entries, obs) => {
                if (entries[0].isIntersecting) {
                    obs.disconnect();
                    populateRow(endpoint, elementId, forceType);
                }
            }, { rootMargin: '300px' }); // start fetching 300px before visible
            observer.observe(el.closest('.row') || el);
        }

        async function populateRow(endpoint, elementId, forceType = null) {
            const data = await fetchAPI(endpoint);
            const container = document.getElementById(elementId);
            if (!container) return;
            const cards = data.results.filter(item => {
                if (!item.backdrop_path) return false;
                if (seenItemIds.has(item.id)) return false;
                seenItemIds.add(item.id);
                return true;
            }).map(item => {
                const type = item.media_type || forceType || item.type || 'movie';
                const title = item.title || item.name;
                return `
                <div class="movie-card" onclick="loadDetails(${item.id}, '${type}')">
                    <img src="${W500_IMG}${item.backdrop_path}" alt="${title}" loading="lazy" decoding="async">
                    <div class="card-title">${title}</div>
                </div>`;
            });
            container.innerHTML = cards.join('');
        }

        // --- Player logic ---
        function openPlayer() {
            if(!currentItem) return;
            const playerView = document.getElementById('player-view');
            const isTV = currentItem.media_type === 'tv';
            const titleText = isTV
                ? `${currentItem.title || currentItem.name} — S${currentSeason} E${currentEpisode}`
                : (currentItem.title || currentItem.name);
            document.getElementById('player-title').innerText = titleText;
            playerView.style.display = 'flex';

            // Tell the parent frame to minimize the dock, mixer and any other panels
            window.parent.postMessage({ source: 'ludus-movie', action: 'playerOpened' }, '*');

            // Default to YapGrid each time player opens
            currentActiveServerId = 'yapgrid';
            document.getElementById('currentServerName').innerText = 'YapGrid';
            loadExtraServer('yapgrid'); // Loads iframe

            // Start continue-watching tracking
            startWatchTracking();

            // Idle UI hide logic — long delay so controls stay accessible
            let timeout;
            const IDLE_DELAY = 5000;
            playerView.onmousemove = () => {
                playerView.classList.remove('idle');
                clearTimeout(timeout);
                timeout = setTimeout(() => playerView.classList.add('idle'), IDLE_DELAY);
            };
            // Topbar hover trigger — fires in parent doc even when conduit frame swallows mouse events
            const topbarTrigger = document.getElementById('player-topbar-trigger');
            const topbarEl      = document.querySelector('.player-topbar');
            const serversPanel  = document.getElementById('serversPanel');
            topbarTrigger.onmouseenter = () => { playerView.classList.remove('idle'); clearTimeout(timeout); };
            topbarEl.onmouseenter      = () => { playerView.classList.remove('idle'); clearTimeout(timeout); };
            topbarEl.onmouseleave      = () => {
                // Don't hide if the servers panel is open
                if (!serversPanel.classList.contains('open')) {
                    timeout = setTimeout(() => playerView.classList.add('idle'), IDLE_DELAY);
                }
            };
        }

        // changeServer delegates to loadExtraServer — single code path for all servers
        async function changeServer(serverId) {
            if (!currentItem) return;
            if (!serverId) serverId = currentActiveServerId || 'yapgrid';
            await loadExtraServer(serverId);
        }

        function closePlayer() {
            stopWatchTracking();
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('player-container').innerHTML = '';
            // Tell the parent frame to restore the dock, mixer and any other panels
            window.parent.postMessage({ source: 'ludus-movie', action: 'playerClosed' }, '*');
        }

const videoEl = document.getElementById('movie-player');

        function broadcastState() {
            if (!videoEl) return;
            window.parent.postMessage({
                source: 'movie',
                title: document.title || 'Playing Movie', // Adjust if you have a specific title element
                paused: videoEl.paused
            }, '*');
        }

        if (videoEl) {
            videoEl.addEventListener('play', broadcastState);
            videoEl.addEventListener('pause', broadcastState);
            videoEl.addEventListener('timeupdate', () => {
                // Throttle this if needed, but it helps keep the UI alive
                if(Math.floor(videoEl.currentTime) % 5 === 0) broadcastState(); 
            });
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !videoEl) return;

            if (data.target === 'movie') {
                if (data.action === 'setVolume') {
                    videoEl.volume = parseFloat(data.volume);
                }
                if (data.action === 'togglePlay') {
                    videoEl.paused ? videoEl.play() : videoEl.pause();
                }
                if (data.action === 'seekForward') {
                    videoEl.currentTime = Math.min(videoEl.duration, videoEl.currentTime + 10);
                }
                if (data.action === 'seekBack') {
                    videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
                }
            }
        });
        // ===== Continue Watching System =====

        function startWatchTracking() {
            stopWatchTracking();
            _cwSessionStart = Date.now();
            _cwSessionSeconds = 0;
            saveToContinueWatching(0); // Immediate save so item shows up right away
            _cwTimer = setInterval(() => {
                _cwSessionSeconds = Math.floor((Date.now() - _cwSessionStart) / 1000);
                saveToContinueWatching(_cwSessionSeconds);
            }, 20000); // Save every 20 seconds
        }

        function stopWatchTracking() {
            if (_cwTimer) { clearInterval(_cwTimer); _cwTimer = null; }
            if (_cwSessionStart) {
                _cwSessionSeconds = Math.floor((Date.now() - _cwSessionStart) / 1000);
                saveToContinueWatching(_cwSessionSeconds);
                _cwSessionStart = null;
            }
        }

        function saveToContinueWatching(additionalSeconds) {
            if (!currentItem) return;
            let list = JSON.parse(localStorage.getItem(CW_KEY) || '[]');
            const entry = {
                tmdbId: currentItem.tmdbId,
                title: currentItem.title || currentItem.name,
                backdrop_path: currentItem.backdrop_path,
                type: currentItem.media_type,
                season: currentItem.media_type === 'tv' ? currentSeason : null,
                episode: currentItem.media_type === 'tv' ? currentEpisode : null,
                watchedAt: Date.now(),
                watchedSeconds: additionalSeconds,
                totalDuration: null, // Will be set by postMessage if available
            };
            // Preserve known duration from existing entry
            const existing = list.find(i => i.tmdbId === entry.tmdbId &&
                (entry.type !== 'tv' || (i.season === entry.season && i.episode === entry.episode)));
            if (existing && existing.totalDuration) entry.totalDuration = existing.totalDuration;

            // Remove old entry for same item/episode and re-insert at front
            list = list.filter(i => {
                if (i.tmdbId !== entry.tmdbId) return true;
                if (entry.type === 'tv') return !(i.season === entry.season && i.episode === entry.episode);
                return false;
            });
            list.unshift(entry);
            list = list.slice(0, 24);
            localStorage.setItem(CW_KEY, JSON.stringify(list));
        }

        function removeContinueWatching(tmdbId, season, episode, event) {
            event.stopPropagation();
            let list = JSON.parse(localStorage.getItem(CW_KEY) || '[]');
            list = list.filter(i => {
                if (i.tmdbId !== tmdbId) return true;
                if (season != null) return !(i.season === season && i.episode === episode);
                return false;
            });
            localStorage.setItem(CW_KEY, JSON.stringify(list));
            renderContinueWatchingRow();
        }

        function resumeWatching(item) {
            currentItem = {
                tmdbId: item.tmdbId,
                title: item.title,
                name: item.title,
                backdrop_path: item.backdrop_path,
                media_type: item.type,
            };
            if (item.type === 'tv') {
                currentSeason = item.season;
                currentEpisode = item.episode;
            }
            openPlayer();
        }

        function renderContinueWatchingRow() {
            const list = JSON.parse(localStorage.getItem(CW_KEY) || '[]');
            const existing = document.getElementById('continue-watching-row');
            if (existing) existing.remove();
            if (list.length === 0) return;

            const dynamicRows = document.getElementById('dynamic-rows');
            if (!dynamicRows) return;

            const cards = list.map(item => {
                const img = item.backdrop_path
                    ? `${W500_IMG}${item.backdrop_path}`
                    : 'https://placehold.co/280x157/111/333?text=No+Image';
                const label = item.type === 'tv' ? `S${item.season} E${item.episode}` : '';
                const pct = cwProgressPct(item);
                const ago = cwTimeAgo(item.watchedAt);
                const removeArgs = `${item.tmdbId}, ${item.season ?? 'null'}, ${item.episode ?? 'null'}, event`;
                return `
                <div class="movie-card cw-card" onclick="resumeWatching(${encodeItemAttr(item)})">
                    <img src="${img}" alt="${escHtml(item.title)}">
                    ${pct > 0 ? `<div class="cw-progress-bar"><div class="cw-progress-fill" style="width:${pct}%"></div></div>` : ''}
                    ${label ? `<div class="cw-ep-badge">${label}</div>` : ''}
                    <div class="cw-time-ago">${ago}</div>
                    <button class="cw-remove-btn" onclick="removeContinueWatching(${removeArgs})" title="Remove">✕</button>
                    <div class="card-title">${escHtml(item.title)}</div>
                </div>`;
            }).join('');

            const rowHtml = `
            <div class="row" id="continue-watching-row">
                <h2>Continue Watching</h2>
                <div class="row-wrapper">
                    <button class="scroll-btn left" onclick="scrollRow('cw-grid', -400)">&#10094;</button>
                    <div class="row-posters" id="cw-grid">${cards}</div>
                    <button class="scroll-btn right" onclick="scrollRow('cw-grid', 400)">&#10095;</button>
                </div>
            </div>`;
            dynamicRows.insertAdjacentHTML('afterbegin', rowHtml);
        }

        function cwProgressPct(item) {
            if (!item.watchedSeconds || item.watchedSeconds < 30) return 0;
            if (item.totalDuration && item.totalDuration > 0) {
                return Math.min(95, Math.round((item.watchedSeconds / item.totalDuration) * 100));
            }
            // Estimate: average movie ~6900s, episode ~2400s
            const est = item.type === 'tv' ? 2400 : 6900;
            return Math.min(90, Math.round((item.watchedSeconds / est) * 100));
        }

        function cwTimeAgo(ts) {
            const d = Date.now() - ts;
            const m = Math.floor(d / 60000);
            const h = Math.floor(d / 3600000);
            const dy = Math.floor(d / 86400000);
            if (m < 2) return 'Just now';
            if (m < 60) return `${m}m ago`;
            if (h < 24) return `${h}h ago`;
            if (dy < 7) return `${dy}d ago`;
            return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function encodeItemAttr(item) {
            // Encode item as a safe JSON string for inline onclick
            return "JSON.parse(decodeURIComponent('" + encodeURIComponent(JSON.stringify(item)) + "'))";
        }

        // Listen for postMessage progress updates from embedded players
        window.addEventListener('message', (event) => {
            const d = event.data;
            if (!d || !currentItem) return;
            // Various player progress event shapes
            const ct = d.currentTime ?? d.time ?? (d.data && d.data.currentTime);
            const dur = d.duration ?? (d.data && d.data.duration);
            if (ct != null && dur != null && dur > 0) {
                let list = JSON.parse(localStorage.getItem(CW_KEY) || '[]');
                const idx = list.findIndex(i => {
                    if (i.tmdbId !== currentItem.tmdbId) return false;
                    if (currentItem.media_type === 'tv') return i.season === currentSeason && i.episode === currentEpisode;
                    return true;
                });
                if (idx >= 0) {
                    list[idx].watchedSeconds = Math.floor(ct);
                    list[idx].totalDuration  = Math.floor(dur);
                    list[idx].watchedAt      = Date.now();
                    localStorage.setItem(CW_KEY, JSON.stringify(list));
                }
            }
        });

        // ===== Actor Profile Modal =====
        async function openActorProfile(actorId) {
            const modal = document.getElementById('actor-modal');
            const card  = document.getElementById('actor-modal-card');
            modal.classList.add('open');
            card.innerHTML = `<div class="actor-modal-loading"><div class="ep-spinner"></div> Loading profile…</div>`;
            document.body.style.overflow = 'hidden';

            try {
                const [person, credits] = await Promise.all([
                    fetchAPI(`/person/${actorId}`),
                    fetchAPI(`/person/${actorId}/combined_credits`)
                ]);

                const photo = person.profile_path ? `${W500_IMG}${person.profile_path}` : '';
                const bornParts = [];
                if (person.birthday) bornParts.push(new Date(person.birthday + 'T00:00:00').toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }));
                if (person.place_of_birth) bornParts.push(person.place_of_birth);
                const bornLine = bornParts.join(' · ');

                // Deduplicate and sort credits by vote_count descending
                const seen = new Set();
                const creditList = [...(credits.cast || [])]
                    .filter(c => { if (seen.has(c.id)) return false; seen.add(c.id); return (c.backdrop_path || c.poster_path); })
                    .sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0))
                    .slice(0, 24);

                card.innerHTML = `
                    <div class="actor-modal-header">
                        ${photo
                            ? `<img class="actor-modal-photo" src="${photo}" alt="${escHtml(person.name)}" onerror="this.src='https://placehold.co/100x100/1a1a1a/555?text=?'">`
                            : `<div class="actor-modal-photo" style="display:flex;align-items:center;justify-content:center;font-size:2rem;color:#555;">?</div>`
                        }
                        <div class="actor-modal-meta">
                            <div class="actor-modal-name">${escHtml(person.name)}</div>
                            ${bornLine ? `<div class="actor-modal-born">${escHtml(bornLine)}</div>` : ''}
                            <div class="actor-modal-tags">
                                ${person.known_for_department ? `<span class="actor-modal-tag">${escHtml(person.known_for_department)}</span>` : ''}
                                ${creditList.length ? `<span class="actor-modal-tag" style="color:var(--text-muted);border-color:rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);">${creditList.length} credits</span>` : ''}
                            </div>
                        </div>
                        <button class="actor-modal-close" onclick="closeActorProfile()">✕</button>
                    </div>

                    ${person.biography ? `
                    <div class="actor-modal-bio">
                        <div class="actor-bio-text" id="actor-bio-text">${escHtml(person.biography)}</div>
                        <span class="actor-bio-toggle" id="actor-bio-toggle" onclick="toggleActorBio()">Show more</span>
                    </div>` : ''}

                    ${creditList.length ? `
                    <div class="actor-modal-section">Known For</div>
                    <div class="actor-credits-row">
                        ${creditList.map(c => {
                            const title  = escHtml(c.title || c.name || '');
                            const type   = c.media_type || 'movie';
                            const year   = (c.release_date || c.first_air_date || '').split('-')[0];
                            const thumb  = c.backdrop_path
                                ? `${W500_IMG}${c.backdrop_path}`
                                : (c.poster_path ? `${W500_IMG}${c.poster_path}` : '');
                            return `
                            <div class="actor-credit-card" onclick="closeActorProfile();loadDetails(${c.id},'${type}')">
                                ${thumb
                                    ? `<img class="actor-credit-thumb" src="${thumb}" alt="${title}" onerror="this.style.opacity=0.3">`
                                    : `<div class="actor-credit-thumb"></div>`}
                                <div class="actor-credit-title">${title}</div>
                                ${year ? `<div class="actor-credit-year">${year}</div>` : ''}
                            </div>`;
                        }).join('')}
                    </div>` : ''}
                `;
            } catch(err) {
                card.innerHTML = `
                    <div style="padding:44px;text-align:center;color:var(--text-muted);position:relative;">
                        <button class="actor-modal-close" onclick="closeActorProfile()">✕</button>
                        <p>Could not load profile.</p>
                    </div>`;
            }
        }

        function closeActorProfile() {
            document.getElementById('actor-modal').classList.remove('open');
            document.body.style.overflow = '';
        }

        function toggleActorBio() {
            const bio    = document.getElementById('actor-bio-text');
            const toggle = document.getElementById('actor-bio-toggle');
            const expanded = bio.classList.toggle('expanded');
            toggle.textContent = expanded ? 'Show less' : 'Show more';
        }

        // Escape key closes actor modal too
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeActorProfile(); }
        });

        // ===== Personalised Recommendations =====
        async function loadPersonalizedRows() {
            const cwList = JSON.parse(localStorage.getItem(CW_KEY) || '[]');
            if (cwList.length === 0) return;

            // Pick up to 3 distinct recently-watched titles
            const seen = new Set();
            const picks = cwList.filter(item => {
                if (seen.has(item.tmdbId)) return false;
                seen.add(item.tmdbId);
                return true;
            }).slice(0, 3);

            const dynamicRows = document.getElementById('dynamic-rows');
            if (!dynamicRows) return;

            // Collect watched genres from CW items to build a genre-weighted "For You" row
            const genreCount = {};
            const fetchedRecs = new Map(); // tmdbId -> rec results

            for (const item of picks) {
                try {
                    const type = item.type || 'movie';
                    const [details, recs] = await Promise.all([
                        fetchAPI(`/${type}/${item.tmdbId}`),
                        fetchAPI(`/${type}/${item.tmdbId}/recommendations`)
                    ]);

                    // Tally genres
                    (details.genres || []).forEach(g => { genreCount[g.id] = (genreCount[g.id] || 0) + 1; });

                    const recItems = (recs.results || [])
                        .filter(r => r.backdrop_path && !seenItemIds.has(r.id))
                        .slice(0, 14);

                    if (recItems.length >= 3) fetchedRecs.set(item.tmdbId, { item, type, recItems });
                } catch(e) { /* skip silently */ }
            }

            // Insert "Because you watched X" rows right after Continue Watching
            const cwRow = document.getElementById('continue-watching-row');
            const insertAfter = cwRow || dynamicRows.firstElementChild;

            for (const [, { item, type, recItems }] of fetchedRecs) {
                recItems.forEach(r => seenItemIds.add(r.id));
                const rowId  = `grid-because-${item.tmdbId}`;
                const label  = `Because you watched: ${item.title}`;
                const rowHtml = createRowHTML(label, rowId);

                if (insertAfter) {
                    insertAfter.insertAdjacentHTML('afterend', rowHtml);
                } else {
                    dynamicRows.insertAdjacentHTML('afterbegin', rowHtml);
                }

                const container = document.getElementById(rowId);
                if (container) {
                    container.innerHTML = recItems.map(r => {
                        const rType = r.media_type || type;
                        return `
                        <div class="movie-card" onclick="loadDetails(${r.id},'${rType}')">
                            <img src="${W500_IMG}${r.backdrop_path}" alt="${escHtml(r.title || r.name)}" loading="lazy" decoding="async">
                            <div class="card-title">${escHtml(r.title || r.name)}</div>
                        </div>`;
                    }).join('');
                }
            }

            // Build a genre-weighted "For You" row using the top 2 genres
            const topGenres = Object.entries(genreCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 2)
                .map(([id]) => id);

            if (topGenres.length > 0) {
                try {
                    const forYouRowId = 'grid-for-you';
                    const forYouHtml  = createRowHTML('Picked For You', forYouRowId);
                    const cwRowNow = document.getElementById('continue-watching-row');
                    if (cwRowNow) {
                        cwRowNow.insertAdjacentHTML('afterend', forYouHtml);
                    } else {
                        dynamicRows.insertAdjacentHTML('afterbegin', forYouHtml);
                    }
                    const forYouData = await fetchAPI(
                        `/discover/movie?with_genres=${topGenres.join(',')}&sort_by=popularity.desc&vote_count.gte=200`
                    );
                    const forYouItems = (forYouData.results || [])
                        .filter(r => r.backdrop_path && !seenItemIds.has(r.id))
                        .slice(0, 14);
                    forYouItems.forEach(r => seenItemIds.add(r.id));
                    const fyContainer = document.getElementById(forYouRowId);
                    if (fyContainer && forYouItems.length >= 3) {
                        fyContainer.innerHTML = forYouItems.map(r => `
                        <div class="movie-card" onclick="loadDetails(${r.id},'movie')">
                            <img src="${W500_IMG}${r.backdrop_path}" alt="${escHtml(r.title || r.name)}" loading="lazy" decoding="async">
                            <div class="card-title">${escHtml(r.title || r.name)}</div>
                        </div>`).join('');
                    } else if (fyContainer) {
                        fyContainer.closest('.row')?.remove();
                    }
                } catch(e) { /* skip */ }
            }
        }

        // Init
        navigate('home');
   

    </script>




    <script>

        // ===== Servers Data =====
        // Only non-proxy servers are available in this local build.
        const EXTRA_SERVERS = [

            { id: 'yapgrid',   name: 'YapGrid',    domain: 'yapgrid.com',  badge: 'Recommended',
              movieUrl: id => `https://yapgrid.com/embed/movie/${id}`,
              tvUrl:    (id,s,e) => `https://yapgrid.com/embed/tv/${id}/${s}/${e}` },

            { id: 'movienigh', name: 'Movie Night', domain: 'movienig.ht', badge: '', useImdb: true,
              movieUrl: id => `https://movienig.ht/watch/movie/${id}`,
              tvUrl:    (id,s,e) => `https://movienig.ht/watch/tv/${id}/${s}/${e}` },

        ];

        let filteredServers = [...EXTRA_SERVERS];

        function renderServersGrid(list) {
            const grid = document.getElementById('serversGrid');
            if (list.length === 0) {
                grid.innerHTML = '<div class="server-no-results">No servers match your search.</div>';
                return;
            }
            grid.innerHTML = list.map(s => {
                const badgeHtml = s.badge === 'Recommended'
                    ? `<div class="s-badge s-badge-rec">Rec</div>`
                    : s.badge === 'Not Recommended'
                    ? `<div class="s-badge s-badge-notreq">Not Rec</div>`
                    : '';
                const isActive = s.id === currentActiveServerId ? ' active-server' : '';
                return `
                <div class="server-tile${isActive}" data-id="${s.id}" onclick="loadExtraServer('${s.id}')">
                    <div class="s-name">${s.name}</div>
                    <div class="s-domain">${s.domain}</div>
                    ${badgeHtml}
                </div>`;
            }).join('');
        }

        function filterServers(query) {
            const q = query.toLowerCase().trim();
            let base = [...EXTRA_SERVERS];
            if (q) {
                base = base.filter(s =>
                    s.name.toLowerCase().includes(q) ||
                    s.domain.toLowerCase().includes(q) ||
                    (s.badge && s.badge.toLowerCase().includes(q))
                );
            }
            filteredServers = base;
            renderServersGrid(filteredServers);
        }

        // ===== Sandbox helpers — removed (sandbox is now locked) =====

        function toggleSandboxSection() {} // kept as no-op for any stale references



        // applySandboxNow removed — sandbox is hardcoded

        // ===== Panel toggle =====
        function toggleServersPanel() {
            const panel = document.getElementById('serversPanel');
            const btn   = document.getElementById('showMoreBtn');
            const isOpen = panel.classList.contains('open');
            if (isOpen) {
                closeServersPanel();
            } else {
                document.getElementById('serverSearch').value = '';
                filteredServers = [...EXTRA_SERVERS];
                renderServersGrid(filteredServers);
                panel.classList.add('open');
                btn.classList.add('open');
                // Keep topbar visible while panel is open
                document.getElementById('player-view').classList.remove('idle');
            }
        }

        function closeServersPanel() {
            document.getElementById('serversPanel').classList.remove('open');
            document.getElementById('showMoreBtn').classList.remove('open');
        }

        // Panel stays open until user clicks X or presses Escape — no auto-dismiss on outside click

async function loadExtraServer(serverId) {
            if (!currentItem) return;
            const server = EXTRA_SERVERS.find(s => s.id === serverId);
            if (!server) return;

            // Track active server and update button label
            currentActiveServerId = serverId;
            document.getElementById('currentServerName').innerText = server.name;
            // Highlight active tile in the panel
            document.querySelectorAll('.server-tile').forEach(t => t.classList.remove('active-server'));
            const activeTile = document.querySelector(`.server-tile[data-id="${serverId}"]`);
            if (activeTile) activeTile.classList.add('active-server');

            const isTV = currentItem.media_type === 'tv';
            const id = currentItem.tmdbId;
            const s = currentSeason || 1;
            const e = currentEpisode || 1;

            // For servers that need an IMDB ID (e.g. Movie Night), fetch it from TMDB first
            let contentId = id;
            if (server.useImdb) {
                try {
                    const extData = await fetchAPI(`/${isTV ? 'tv' : 'movie'}/${id}/external_ids`);
                    if (extData.imdb_id) contentId = extData.imdb_id;
                } catch(err) {
                    console.warn('[Ludus] ID lookup failed:', err);
                }
            }
            const streamUrl = isTV ? server.tvUrl(contentId, s, e) : server.movieUrl(contentId);

            // Show loader
            const extraIframeId = 'player-iframe-' + Date.now();
            const extraContainer = document.getElementById('player-container');
            extraContainer.innerHTML = `
                <div class="player-loader" id="player-loader">
                    <div class="player-loader-spinner"></div>
                    <span class="player-loader-label" id="player-loader-label">Loading…</span>
                </div>`;

            extraContainer.insertAdjacentHTML('beforeend', `
                <iframe id="${extraIframeId}" src="${streamUrl}"
                        width="100%" height="100%" style="border:none;"
                        allowfullscreen allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *"></iframe>`);
            const extraLoaderEl = document.getElementById('player-loader');
            document.getElementById(extraIframeId).addEventListener('load', () => {
                extraLoaderEl.classList.add('fade-out');
                setTimeout(() => extraLoaderEl.remove(), 320);
            }, { once: true });

            // Panel stays open so user can quickly switch again
        }
        // Close panel on Escape key
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeServersPanel();
        });
    </script>
