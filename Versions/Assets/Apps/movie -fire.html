<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus TV - Silk Optimized</title>
    <style>
        :root {
            --bg-primary: #040404;
            --bg-secondary: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.15);
            --accent: #00C9FF;
            --accent-glow: rgba(0, 201, 255, 0.8);
            --sidebar-width: 320px;
            --focus-outline: 4px solid var(--accent);
        }

        ::-webkit-scrollbar { display: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            font-size: 20px; 
        }

        /* Focus States for Fire TV Remote / Silk */
        .focusable {
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border 0.2s;
        }
        
        .focusable:focus, .focusable:hover {
            transform: scale(1.05);
            border: var(--focus-outline) !important;
            box-shadow: 0 0 30px var(--accent-glow);
            z-index: 50;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 50px 30px;
            z-index: 100;
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            width: 100%;
            height: 70px;
            background: transparent;
            border: 4px solid transparent;
            border-radius: 16px;
            color: var(--text-secondary);
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            padding: 0 24px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .nav-btn.active {
            color: var(--text-primary);
            background: rgba(255,255,255,0.1);
        }

        /* Added a small divider before the scroll button */
        .nav-divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
            width: 100%;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth; /* Enables smooth scrolling back to top */
        }

        .top-bar {
            padding: 40px 32px;
            display: flex;
            gap: 20px;
            flex-shrink: 0;
            background: rgba(4, 4, 4, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        .search-input, .media-filter {
            height: 60px;
            background: var(--glass);
            border: 4px solid transparent;
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 20px;
            padding: 0 30px;
        }

        .search-input { flex: 1; }
        .media-filter { width: 200px; }
        .media-filter option { background: #111; color: white; }

        /* Grid - Reverted to Original Sizes */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 28px;
            padding: 32px;
        }

        .movie-card {
            background: rgba(255,255,255,0.02);
            border: 4px solid transparent; /* Adjusted for TV focus layout shift */
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: #111;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .movie-info {
            padding: 16px;
        }

        .movie-title { 
            font-size: 16px; 
            font-weight: 600; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            margin-bottom: 6px;
        }
        
        .movie-year { 
            font-size: 14px; 
            color: var(--text-secondary); 
        }

        /* Fullscreen Player Overlay */
        .player-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
        }

        .player-overlay.active { display: block; }

        .video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        /* Tiny Exit Button */
        .exit-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1010;
            backdrop-filter: blur(4px);
        }

        .exit-btn:focus, .exit-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }

        /* Server Switcher */
        .server-switcher {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            gap: 8px;
            z-index: 1010;
        }

        .server-btn {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.55);
            border: 1.5px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .server-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
            color: #fff;
        }

        .server-btn.active {
            background: rgba(255, 107, 0, 0.18);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px rgba(255,107,0,0.25);
        }

        .server-btn:focus {
            outline: none;
            border-color: var(--accent);
        }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">Ludus TV</div>
        
        <button class="nav-btn active focusable" id="btnDiscover" tabindex="0" onclick="switchTab('discover')" onkeydown="if(event.key === 'Enter') switchTab('discover')">Discover</button>
        
        <button class="nav-btn focusable" id="btnRecent" tabindex="0" onclick="switchTab('recent')" onkeydown="if(event.key === 'Enter') switchTab('recent')">History</button>
        
        <div class="nav-divider"></div>
        
        <button class="nav-btn focusable" id="btnScroll" tabindex="0" onclick="scrollToTop()" onkeydown="if(event.key === 'Enter') scrollToTop()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 10px;">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
            Scroll up
        </button>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="top-bar">
            <select id="mediaFilter" class="media-filter focusable" tabindex="0" onchange="fetchContent()">
                <option value="all">All</option>
                <option value="movie">Movies</option>
                <option value="tv">TV</option>
            </select>
            <input type="text" class="search-input focusable" placeholder="Search..." id="searchInput" tabindex="0" oninput="debounceFetch()">
        </header>

        <div class="movie-grid" id="movieGrid"></div>
    </main>

    <div class="player-overlay" id="playerOverlay">
        <div class="video-container" id="playerContainer">
            </div>
    </div>

    <script>
        const TMDB_API_KEY = 'e55425032d3d0f371fc776f302e7c09b';
        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');
        const mediaFilter = document.getElementById('mediaFilter');
        const mainContent = document.getElementById('mainContent');
        
        let currentRenderedItems = [];
        let currentTab = 'discover';
        let fetchTimeout;

        window.onload = () => {
            document.getElementById('btnDiscover').focus();
            fetchContent();
        };

        // Scroll to top function for the new sidebar button
        function scrollToTop() {
            mainContent.scrollTo({ top: 0, behavior: 'smooth' });
            // Optional: Focus the search bar after scrolling up for easy access
            setTimeout(() => {
                document.getElementById('searchInput').focus();
            }, 300);
        }

        function debounceFetch() {
            clearTimeout(fetchTimeout);
            fetchTimeout = setTimeout(fetchContent, 600);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btnDiscover').classList.toggle('active', tab === 'discover');
            document.getElementById('btnRecent').classList.toggle('active', tab === 'recent');
            
            if (tab === 'recent') {
                const recents = JSON.parse(localStorage.getItem('ludus_recent') || '[]');
                renderGrid(recents);
            } else {
                fetchContent();
            }
            scrollToTop();
        }

        async function fetchContent() {
            if (currentTab !== 'discover') return;

            const query = searchInput.value.trim();
            const filter = mediaFilter.value;
            let url = '';

            try {
                if (query) {
                    if (filter === 'all') url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
                    else url = `https://api.themoviedb.org/3/search/${filter}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
                } else {
                    if (filter === 'all') url = `https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_API_KEY}`;
                    else if (filter === 'movie') url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=en-US&page=1`;
                    else if (filter === 'tv') url = `https://api.themoviedb.org/3/tv/on_the_air?api_key=${TMDB_API_KEY}&language=en-US&page=1`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                currentRenderedItems = data.results.filter(i => i.media_type !== 'person').map(item => {
                    let type = item.media_type || (filter === 'all' ? 'movie' : filter);
                    return {
                        tmdbId: item.id,
                        type: type,
                        title: item.title || item.name,
                        year: (item.release_date || item.first_air_date || '').split('-')[0] || 'N/A',
                        poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/300x450/222/fff?text=No+Poster'
                    };
                });
                renderGrid(currentRenderedItems);
            } catch (e) { console.error(e); }
        }

        function renderGrid(items) {
            movieGrid.innerHTML = items.map((item, index) => `
                <div class="movie-card focusable" tabindex="0" onclick="handleItemClick(${index})" onkeydown="if(event.key === 'Enter') handleItemClick(${index})">
                    <img src="${item.poster}" class="movie-poster">
                    <div class="movie-info">
                        <div class="movie-title">${item.title}</div>
                        <div class="movie-year">${item.year}</div>
                    </div>
                </div>
            `).join('');
        }

        // Auto-scroll when navigating via D-pad
        document.addEventListener('focusin', (e) => {
            if (e.target.classList.contains('movie-card')) {
                // Adjusts the scroll position smoothly to keep the focused item in view
                e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });

        function handleItemClick(index) {
            const item = currentRenderedItems[index];
            addToRecent(item);
            openPlayer(item);
        }

        function addToRecent(item) {
            let recents = JSON.parse(localStorage.getItem('ludus_recent') || '[]');
            recents = recents.filter(r => r.tmdbId !== item.tmdbId);
            recents.unshift(item);
            if (recents.length > 40) recents = recents.slice(0, 40);
            localStorage.setItem('ludus_recent', JSON.stringify(recents));
        }

        let activePlayerItem = null;

        const SERVERS = [
            {
                id: 'vidsrc_pm',
                label: 'Server 1 — VidSrc.pm',
                getUrl: (item) => item.type === 'tv'
                    ? `https://vidsrc.pm/embed/tv/${item.tmdbId}`
                    : `https://vidsrc.pm/embed/movie/${item.tmdbId}`,
                sandbox: 'sandbox="allow-scripts allow-same-origin allow-presentation allow-pointer-lock allow-fullscreen"'
            },
            {
                id: 'vidrock',
                label: 'Server 2 — VidRock',
                getUrl: (item) => item.type === 'tv'
                    ? `https://vidrock.ru/embed/tv/${item.tmdbId}`
                    : `https://vidrock.ru/embed/movie/${item.tmdbId}`,
                sandbox: ''
            },
            {
                id: 'flixy',
                label: 'Server 3 — Flixy',
                getUrl: (item) => item.type === 'tv'
                    ? `https://flicky.host/embed/tv/?id=${item.tmdbId}`
                    : `https://flicky.host/embed/movie/?id=${item.tmdbId}`,
                sandbox: ''
            }
        ];

        function openPlayer(item) {
            activePlayerItem = item;
            const overlay = document.getElementById('playerOverlay');
            overlay.classList.add('active');
            loadServer('vidsrc_pm');
        }

        function loadServer(serverId) {
            if (!activePlayerItem) return;
            const container = document.getElementById('playerContainer');
            const server = SERVERS.find(s => s.id === serverId);
            if (!server) return;

            const streamUrl = server.getUrl(activePlayerItem);

            container.innerHTML = `
                <iframe 
                    src="${streamUrl}" 
                    width="100%" 
                    height="100%" 
                    style="border: none;" 
                    ${server.sandbox}
                    allowfullscreen="true" 
                    webkitallowfullscreen="true" 
                    mozallowfullscreen="true">
                </iframe>

                <div class="server-switcher">
                    ${SERVERS.map(s => `
                        <button class="server-btn focusable ${s.id === serverId ? 'active' : ''}" 
                                tabindex="0"
                                onclick="loadServer('${s.id}')"
                                onkeydown="if(event.key==='Enter') loadServer('${s.id}')">
                            ${s.label}
                        </button>`).join('')}
                </div>

                <button class="exit-btn focusable" tabindex="0" onclick="closePlayer()" onkeydown="if(event.key === 'Enter') closePlayer()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            `;

            setTimeout(() => {
                const exitBtn = document.querySelector('.exit-btn');
                if (exitBtn) exitBtn.focus();
            }, 300);
        }

        function closePlayer() {
            const overlay = document.getElementById('playerOverlay');
            const container = document.getElementById('playerContainer');
            
            overlay.classList.remove('active');
            container.innerHTML = '';
            activePlayerItem = null;
            
            // Return focus to the grid
            document.getElementById('btnDiscover').focus();
        }
    </script>
</body>
</html>
