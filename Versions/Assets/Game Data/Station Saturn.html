<script>
(function() {
    let masterGainNodes = [];
    let currentVolume = 1.0;

    // 1. Intercept the Web Audio API (Catches Unity, Construct, Phaser, etc.)
    const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
    if (OriginalAudioContext) {
        window.AudioContext = function(...args) {
            const ctx = new OriginalAudioContext(...args);
            
            // Create a master volume controller (GainNode)
            const gainNode = ctx.createGain();
            gainNode.gain.value = currentVolume;
            
            // Connect our volume controller to the actual speakers
            const originalDestination = ctx.destination;
            gainNode.connect(originalDestination);
            
            masterGainNodes.push(gainNode);

            // Trick the game into connecting its sounds to our volume controller
            Object.defineProperty(ctx, 'destination', {
                get: () => gainNode
            });

            return ctx;
        };
        window.webkitAudioContext = window.AudioContext;
    }

    // 2. Listen for the volume slider adjustments from your mixer
    window.addEventListener('message', function(event) {
        if (event.data && event.data.action === 'setGameVolume') {
            currentVolume = Math.max(0, Math.min(1, event.data.volume));

            // A. Update standard HTML5 Audio/Video tags
            const mediaElements = document.querySelectorAll('audio, video');
            mediaElements.forEach(media => {
                media.volume = currentVolume;
            });

            // B. Update Web Audio API master volume
            masterGainNodes.forEach(gainNode => {
                gainNode.gain.value = currentVolume;
            });
        }
    });
})();
// === GLOBAL LOCALSTORAGE OVERRIDE ===
// Place this at the VERY TOP of your <script> tags, before any other logic.
(function forceLocalData() {
    console.warn("Storage Override Active: Forcing session data to localStorage and disabling cloud overwrites.");

    // 1. Redirect sessionStorage to localStorage
    try {
        const originalSessionStorage = window.sessionStorage;
        
        // We create a proxy to catch all gets/sets/removes intended for the session
        const sessionToLocalProxy = {
            getItem: function(key) { return window.localStorage.getItem(`session_proxy_${key}`); },
            setItem: function(key, value) { window.localStorage.setItem(`session_proxy_${key}`, value); },
            removeItem: function(key) { window.localStorage.removeItem(`session_proxy_${key}`); },
            clear: function() {
                // Only clear the proxied session items, not the whole localStorage
                Object.keys(window.localStorage).forEach(key => {
                    if (key.startsWith('session_proxy_')) window.localStorage.removeItem(key);
                });
            },
            get length() {
                return Object.keys(window.localStorage).filter(k => k.startsWith('session_proxy_')).length;
            }
        };

        // Attempt to hijack the global sessionStorage object
        Object.defineProperty(window, 'sessionStorage', {
            value: sessionToLocalProxy,
            configurable: true,
            enumerable: true,
            writable: false
        });
    } catch (e) {
        console.error("Could not override sessionStorage. The browser may have locked it.", e);
    }

    // 2. Lock down Cloud Overwrite logic
    // This forces your existing mathmaster_cloud_overwrite variable to always be false locally
    window.localStorage.setItem("mathmaster_cloud_overwrite", "false");
    
    // Intercept localStorage.setItem to prevent the app from turning cloud overwrite back on
    const originalSetItem = window.localStorage.setItem;
    window.localStorage.setItem = function(key, value) {
        if (key === "mathmaster_cloud_overwrite" && value === "true") {
            console.warn("Blocked attempt to enable cloud overwrite. Forced to local only.");
            originalSetItem.call(window.localStorage, key, "false");
            return;
        }
        originalSetItem.call(window.localStorage, key, value);
    };
})();
</script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Station Saturn</title>

  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=1280 height=720></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Station Saturn</div>
    </div>
  </div>
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");

    // Shows a temporary message banner/ribbon for a few seconds, or
    // a permanent error message on top of the canvas if type=='error'.
    // If type=='warning', a yellow highlight color is used.
    // Modify or remove this function to customize the visually presented
    // way that non-critical warnings and error messages are presented to the
    // user.
    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function() {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.gz",
      frameworkUrl: buildUrl + "/WebGL.framework.js.gz",
      codeUrl: buildUrl + "/WebGL.wasm.gz",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "MaksimChmutov",
      productName: "Station Saturn",
      productVersion: "1.0.0",
      showBanner: unityShowBanner,
    };

    // By default Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:

      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;

      unityShowBanner('WebGL builds are not supported on mobile devices.');
    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

      canvas.style.width = "1280px";
      canvas.style.height = "720px";
    }

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
  <script>
document.addEventListener("DOMContentLoaded", () => {
    function autoFS() {
        try {
            if (typeof unityInstance !== "undefined") {
                unityInstance.SetFullscreen(1);
            }
        } catch(e) {}

        document.removeEventListener("click", autoFS);
        document.removeEventListener("touchstart", autoFS);
    }

    document.addEventListener("click", autoFS);
    document.addEventListener("touchstart", autoFS);
});
</script>

</body>
