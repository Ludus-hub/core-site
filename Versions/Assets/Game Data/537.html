  // Block all fullscreen requests from Unity or any script
  const noop = () => Promise.resolve();

(function() {
    let masterGainNodes = [];
    let currentVolume = 1.0;
    const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
    if (OriginalAudioContext) {
        window.AudioContext = function(...args) {
            const ctx = new OriginalAudioContext(...args);
            const gainNode = ctx.createGain();
            gainNode.gain.value = currentVolume;
            const originalDestination = ctx.destination;
            gainNode.connect(originalDestination);
            masterGainNodes.push(gainNode);
            Object.defineProperty(ctx, 'destination', { get: () => gainNode });
            return ctx;
        };
        window.webkitAudioContext = window.AudioContext;
    }
    window.addEventListener('message', function(event) {
        if (event.data && event.data.action === 'setGameVolume') {
            currentVolume = Math.max(0, Math.min(1, event.data.volume));
            document.querySelectorAll('audio, video').forEach(m => m.volume = currentVolume);
            masterGainNodes.forEach(g => g.gain.value = currentVolume);
        }
    });
})();
