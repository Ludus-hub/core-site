<!DOCTYPE html>
<html lang="en">

<head>
<script>
(function() {
    let masterGainNodes = [];
    let currentVolume = 1.0;

    // 1. Intercept the Web Audio API (Catches Unity, Construct, Phaser, etc.)
    const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
    if (OriginalAudioContext) {
        window.AudioContext = function(...args) {
            const ctx = new OriginalAudioContext(...args);
            
            // Create a master volume controller (GainNode)
            const gainNode = ctx.createGain();
            gainNode.gain.value = currentVolume;
            
            // Connect our volume controller to the actual speakers
            const originalDestination = ctx.destination;
            gainNode.connect(originalDestination);
            
            masterGainNodes.push(gainNode);

            // Trick the game into connecting its sounds to our volume controller
            Object.defineProperty(ctx, 'destination', {
                get: () => gainNode
            });

            return ctx;
        };
        window.webkitAudioContext = window.AudioContext;
    }

    // 2. Listen for the volume slider adjustments from your mixer
    window.addEventListener('message', function(event) {
        if (event.data && event.data.action === 'setGameVolume') {
            currentVolume = Math.max(0, Math.min(1, event.data.volume));

            // A. Update standard HTML5 Audio/Video tags
            const mediaElements = document.querySelectorAll('audio, video');
            mediaElements.forEach(media => {
                media.volume = currentVolume;
            });

            // B. Update Web Audio API master volume
            masterGainNodes.forEach(gainNode => {
                gainNode.gain.value = currentVolume;
            });
        }
    });
})();
// === GLOBAL LOCALSTORAGE OVERRIDE ===
// Place this at the VERY TOP of your <script> tags, before any other logic.
(function forceLocalData() {
    console.warn("Storage Override Active: Forcing session data to localStorage and disabling cloud overwrites.");

    // 1. Redirect sessionStorage to localStorage
    try {
        const originalSessionStorage = window.sessionStorage;
        
        // We create a proxy to catch all gets/sets/removes intended for the session
        const sessionToLocalProxy = {
            getItem: function(key) { return window.localStorage.getItem(`session_proxy_${key}`); },
            setItem: function(key, value) { window.localStorage.setItem(`session_proxy_${key}`, value); },
            removeItem: function(key) { window.localStorage.removeItem(`session_proxy_${key}`); },
            clear: function() {
                // Only clear the proxied session items, not the whole localStorage
                Object.keys(window.localStorage).forEach(key => {
                    if (key.startsWith('session_proxy_')) window.localStorage.removeItem(key);
                });
            },
            get length() {
                return Object.keys(window.localStorage).filter(k => k.startsWith('session_proxy_')).length;
            }
        };

        // Attempt to hijack the global sessionStorage object
        Object.defineProperty(window, 'sessionStorage', {
            value: sessionToLocalProxy,
            configurable: true,
            enumerable: true,
            writable: false
        });
    } catch (e) {
        console.error("Could not override sessionStorage. The browser may have locked it.", e);
    }

    // 2. Lock down Cloud Overwrite logic
    // This forces your existing mathmaster_cloud_overwrite variable to always be false locally
    window.localStorage.setItem("mathmaster_cloud_overwrite", "false");
    
    // Intercept localStorage.setItem to prevent the app from turning cloud overwrite back on
    const originalSetItem = window.localStorage.setItem;
    window.localStorage.setItem = function(key, value) {
        if (key === "mathmaster_cloud_overwrite" && value === "true") {
            console.warn("Blocked attempt to enable cloud overwrite. Forced to local only.");
            originalSetItem.call(window.localStorage, key, "false");
            return;
        }
        originalSetItem.call(window.localStorage, key, value);
    };
})();

    <div id="loading-text" style="color: white; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="canvas"> Your browser does not support the canvas tag. </canvas>
    <noscript> Your browser does not support JavaScript. </noscript>
    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="thats-not-my-neighbor.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>
    <script src="thats-not-my-neighbor.js"></script>
    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "ensureCrossOriginIsolationHeaders": false,
            "executable": "thats-not-my-neighbor",
            "experimentalVK": false,
            "fileSizes": {
                "thats-not-my-neighbor.pck": 410934256,
                "thats-not-my-neighbor.wasm": 43444261
            },
            "focusCanvas": true,
            "gdextensionLibs": []
        };
        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);
        window.godotrunfunction = function () {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');
            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                const lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
            }
            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
            });
            if (missing.length !== 0) {
                if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                    let serviceWorkerRegistrationPromise;
                    try {
                        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                    }
                    // There's a chance that installing the service worker would fix the issue
                    Promise.race([
                        serviceWorkerRegistrationPromise.then((registration) => {
                            if (registration != null) {
                                return Promise.reject(new Error('Service worker already exists.'));
                            }
                            return registration;
                        }).then(() => engine.installServiceWorker()),
                        // For some reason, `getRegistration()` can stall
                        new Promise((resolve) => {
                            setTimeout(() => resolve(), 2000);
                        }),
                    ]).then(() => {
                        // Reload if there was no error.
                        window.location.reload();
                    }).catch((err) => {
                        console.error('Error while registering service worker:', err);
                    });
                } else {
                    // Display the message as usual
                    const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                    displayFailureNotice(missingMsg + missing.join('\n'));
                }
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        };
    </script>
