    <script>
  // Block all fullscreen requests from Unity or any script
  const noop = () => Promise.resolve();
  document.documentElement.requestFullscreen = noop;
  document.documentElement.webkitRequestFullscreen = noop;
  Element.prototype.requestFullscreen = noop;
  Element.prototype.webkitRequestFullscreen = noop;
  Element.prototype.mozRequestFullScreen = noop;
  Element.prototype.msRequestFullscreen = noop;

(function() {
    let masterGainNodes = [];
    let currentVolume = 1.0;
    const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
    if (OriginalAudioContext) {
        window.AudioContext = function(...args) {
            const ctx = new OriginalAudioContext(...args);
            const gainNode = ctx.createGain();
            gainNode.gain.value = currentVolume;
            const originalDestination = ctx.destination;
            gainNode.connect(originalDestination);
            masterGainNodes.push(gainNode);
            Object.defineProperty(ctx, 'destination', { get: () => gainNode });
            return ctx;
        };
        window.webkitAudioContext = window.AudioContext;
    }
    window.addEventListener('message', function(event) {
        if (event.data && event.data.action === 'setGameVolume') {
            currentVolume = Math.max(0, Math.min(1, event.data.volume));
            document.querySelectorAll('audio, video').forEach(m => m.volume = currentVolume);
            masterGainNodes.forEach(g => g.gain.value = currentVolume);
        }
    });
})();
// === GLOBAL LOCALSTORAGE OVERRIDE ===
// Place this at the VERY TOP of your <script> tags, before any other logic.
(function forceLocalData() {
    console.warn("Storage Override Active: Forcing session data to localStorage and disabling cloud overwrites.");

    // 1. Redirect sessionStorage to localStorage
    try {
        const originalSessionStorage = window.sessionStorage;
        
        // We create a proxy to catch all gets/sets/removes intended for the session
        const sessionToLocalProxy = {
            getItem: function(key) { return window.localStorage.getItem(`session_proxy_${key}`); },
            setItem: function(key, value) { window.localStorage.setItem(`session_proxy_${key}`, value); },
            removeItem: function(key) { window.localStorage.removeItem(`session_proxy_${key}`); },
            clear: function() {
                // Only clear the proxied session items, not the whole localStorage
                Object.keys(window.localStorage).forEach(key => {
                    if (key.startsWith('session_proxy_')) window.localStorage.removeItem(key);
                });
            },
            get length() {
                return Object.keys(window.localStorage).filter(k => k.startsWith('session_proxy_')).length;
            }
        };

        // Attempt to hijack the global sessionStorage object
        Object.defineProperty(window, 'sessionStorage', {
            value: sessionToLocalProxy,
            configurable: true,
            enumerable: true,
            writable: false
        });
    } catch (e) {
        console.error("Could not override sessionStorage. The browser may have locked it.", e);
    }

    // 2. Lock down Cloud Overwrite logic
    // This forces your existing mathmaster_cloud_overwrite variable to always be false locally
    window.localStorage.setItem("mathmaster_cloud_overwrite", "false");
    
    // Intercept localStorage.setItem to prevent the app from turning cloud overwrite back on
    const originalSetItem = window.localStorage.setItem;
    window.localStorage.setItem = function(key, value) {
        if (key === "mathmaster_cloud_overwrite" && value === "true") {
            console.warn("Blocked attempt to enable cloud overwrite. Forced to local only.");
            originalSetItem.call(window.localStorage, key, "false");
            return;
        }
        originalSetItem.call(window.localStorage, key, value);
    };
})();

    <script>
    var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '120.36';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("gash-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts("Build/daddyreeyuki.data", 1, 5), "daddyreeyuki.data"),
        mergeFiles(getParts("Build/daddyreeyuki.wasm", 1, 3), "daddyreeyuki.wasm")
      ]);
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: dataUrl,
        frameworkUrl: "Build/daddyreeyuki.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Joe Williams",
        productName: "WhosYourDaddy",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then(unityInstance => {
        loadingText.remove();
      }).catch(message => {
        alert(message);
      });
    })();
