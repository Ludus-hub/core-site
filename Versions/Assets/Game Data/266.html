<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/speed-stars/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Speed Stars</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* This CSS ensures the container fills the browser tab perfectly */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
    </div>

    <script>
        window.fileMergerConfig = {
            files: [
                { name: 'webgl.data', parts: 5 },
                { name: 'webgl.wasm', parts: 3 },
                { name: 'webgl.framework.js', parts: 1 },
            ],
            basePath: 'Build/',
            debug: false
        };
    </script>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        function unityShowBanner(msg, type) {
            // Optional: Handle Unity warnings here
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/webgl.loader.js";
        var config = {
            dataUrl: buildUrl + "/webgl.data",
            frameworkUrl: buildUrl + "/webgl.framework.js",
            codeUrl: buildUrl + "/webgl.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Luke Doukakis",
            productName: "Speed Stars",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        // --- FIXED TAB-FULLSCREEN LOGIC ---
        function resizeCanvas() {
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }

        // Apply mobile meta tags if needed, but use the same resize logic for both
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
        }

        // Initial resize and listener to keep it filling the tab
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        // ----------------------------------

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
