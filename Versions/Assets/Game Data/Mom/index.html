<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Mom's House</title>
    <style>
        /* =========================================
           CSS STYLES & NIGHTTIME FILTERS
           ========================================= */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* The main office (Boy's Bedroom) */
        #office {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('assets/boy_bedroom.jpg');
            background-size: cover;
            background-position: center;
            /* This filter turns a daytime photo into a dark, spooky nighttime room */
            filter: brightness(25%) contrast(120%) sepia(20%) hue-rotate(180deg);
            transition: filter 0.2s;
            z-index: 1;
        }

        /* When the door light is on */
        .light-on {
            filter: brightness(80%) contrast(110%) sepia(10%) !important;
        }

        /* Camera System Overlay */
        #camera-system {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 10;
        }

        #camera-view {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            /* Night vision camera filter: Greenish, bright, static-y */
            filter: grayscale(100%) brightness(50%) contrast(150%) sepia(50%) hue-rotate(80deg);
        }

        /* CRT Scanline effect over cameras */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 11;
        }

        /* Updated: Mom is now a full-screen, dark silhouette */
/* Updated: Stops multiplying and makes her a dark silhouette */
        #mom-graphic {
            position: absolute;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: url('assets/angry_mom.png');
            background-size: contain; 
            background-repeat: no-repeat; /* FIX: Stops her from multiplying */
            background-position: center;
            z-index: 12;
            /* Darker silhouette look */
            filter: brightness(50%) contrast(100%) grayscale(100%); 
            pointer-events: none;
        }

        /* FNAF Map Lines Layer */
        #map-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Sits behind buttons */
            pointer-events: none;
        }

        /* New: Visual flash for when she moves rooms */
        .camera-flash {
            animation: flash-white 0.15s steps(2) infinite;
        }

        @keyframes flash-white {
            from { filter: brightness(500%) invert(100%); }
            to { filter: brightness(100%) invert(0%); }
        }

        /* UI Elements */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .ui-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #time-display { top: 20px; right: 30px; font-size: 36px; }
        #night-display { top: 60px; right: 30px; }
        #power-display { bottom: 20px; left: 30px; }
        #usage-display { bottom: 50px; left: 30px; color: #0f0; }

        /* Controls */
        #controls-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            z-index: 5;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn {
            background-color: rgba(50, 50, 50, 0.8);
            border: 2px solid white;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
            font-family: 'Courier New', Courier, monospace;
            transition: 0.2s;
        }

        .btn:hover { background-color: white; color: black; }
        .btn.active { background-color: red; color: white; border-color: darkred; }



#map {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 280px;
    height: 320px;
    border: 2px solid white;
    background: rgba(0,0,0,0.8);
    z-index: 15;
}

.cam-btn {
    position: absolute;
    width: 90px;
    height: 35px;
    font-size: 10px;
    background: #222;
    color: white;
    border: 1px solid #555;
    z-index: 2;
}

/* Positioning based on the path Mom takes to your room */
#btn-cam5 { top: 10px; left: 95px; }   /* Start: Backyard */
#btn-cam2 { top: 60px; left: 95px; }   /* Living Room */
#btn-cam1 { top: 110px; left: 95px; }  /* Kitchen */
#btn-cam3 { top: 160px; left: 95px; }  /* Master BR */
#btn-cam4 { top: 210px; left: 95px; }  /* Bathroom */
#btn-cam6 { top: 260px; left: 95px; }  /* End: Hallway */
        /* Camera Toggle Button */
        #toggle-cams {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 25;
        }
        #toggle-cams:hover { background: rgba(255,255,255,0.5); }

        /* Screens (Start, Death, Win) */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #jumpscare-screen {
            display: none;
            background-image: url('assets/angry_mom.png');
            background-size: cover;
            background-position: center;
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

    </style>
</head>
<body>
<div id="office">
    <div id="mom-peek" style="display:none; position:absolute; right:10%; top:0; width:40%; height:100%; background:url('assets/angry_mom.png') no-repeat center; background-size:contain; filter:brightness(0%) contrast(500%); z-index:5;"></div>
</div>
    <div id="game-container">
        <div id="office"></div>

        <div id="camera-system">
            <div id="camera-view"></div>
            <div class="scanlines"></div>
            <div id="mom-graphic"></div>
            

<div id="map">
    <svg width="280" height="320" style="position:absolute; top:0; left:0;">
        <g stroke="white" stroke-width="3" opacity="0.4">
            <line x1="140" y1="45" x2="140" y2="60" />
            <line x1="140" y1="95" x2="140" y2="110" />
            <line x1="140" y1="145" x2="140" y2="160" />
            <line x1="140" y1="195" x2="140" y2="210" />
            <line x1="140" y1="245" x2="140" y2="260" />
            <line x1="140" y1="295" x2="140" y2="320" stroke-dasharray="5,5" />
        </g>
    </svg>

    <button id="btn-cam5" class="cam-btn" onclick="switchCam('cam5')">CAM 05<br>Backyard</button>
    <button id="btn-cam2" class="cam-btn" onclick="switchCam('cam2')">CAM 02<br>Living Rm</button>
    <button id="btn-cam1" class="cam-btn" onclick="switchCam('cam1')">CAM 01<br>Kitchen</button>
    <button id="btn-cam3" class="cam-btn" onclick="switchCam('cam3')">CAM 03<br>Master BR</button>
    <button id="btn-cam4" class="cam-btn" onclick="switchCam('cam4')">CAM 04<br>Bathroom</button>
    <button id="btn-cam6" class="cam-btn" onclick="switchCam('cam6')">CAM 06<br>Hallway</button>
</div>
</div>
        </div>

        <button id="toggle-cams" onclick="toggleCameras()">[ ^ ] Open Cameras [ ^ ]</button>

        <div id="controls-layer">
            <button class="btn" id="door-btn" onclick="toggleDoor()">DOOR: OPEN</button>
            <button class="btn" id="light-btn" onclick="toggleLight()">LIGHT: OFF</button>
        </div>

        <div id="ui-layer">
            <div id="time-display" class="ui-text">12:00 AM</div>
            <div id="night-display" class="ui-text">Night 1</div>
            <div id="power-display" class="ui-text">Power left: 100%</div>
            <div id="usage-display" class="ui-text">Usage: [|    ]</div>
        </div>

        <div id="start-screen" class="overlay-screen">
            <h1>FIVE NIGHTS AT MOM'S HOUSE</h1>
            <p>Survive from 12 AM to 6 AM.</p>
            <p>Check the cameras. If Mom gets to the hallway, shut the door.</p>
            <p>Don't run out of power.</p>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <div id="jumpscare-screen" class="overlay-screen">
            <h1 style="color: red; font-size: 80px; text-shadow: 5px 5px 0 #000;">YOU'RE GROUNDED!</h1>
        </div>

        <div id="win-screen" class="overlay-screen" style="display:none;">
            <h1>6:00 AM</h1>
            <p>You survived the night.</p>
            <button class="btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        /* =========================================
           GAME LOGIC & AI
           ========================================= */

        // --- Game State Variables ---
        let gameActive = false;
        let timeHour = 0; // 0 = 12AM, 6 = 6AM
        let power = 100;
        let usage = 1;
        
        let doorClosed = false;
        let lightOn = false;
        let camerasUp = false;
        let currentCam = 'cam1';

        // Timers
        let clockTimer;
        let powerTimer;
        let momAITimer;

        // --- Camera Room Setup ---
        const rooms = {
            'cam1': { name: 'Kitchen', img: 'assets/kitchen.jpg' },
            'cam2': { name: 'Living Room', img: 'assets/living_room.jpg' },
            'cam3': { name: 'Master Bedroom', img: 'assets/master_bedroom.jpg' },
            'cam4': { name: 'Bathroom', img: 'assets/bathroom.jpg' },
            'cam5': { name: 'Backyard', img: 'assets/backyard.jpg' },
            'cam6': { name: 'Hallway', img: 'assets/hallway.webp' }
        };

        // --- Mom AI Logic ---
        // Mom's path to your room: Backyard -> Living Room -> Kitchen -> Master Bedroom -> Bathroom -> Hallway -> Attack
        const momPath = ['cam5', 'cam2', 'cam1', 'cam3', 'cam4', 'cam6', 'door', 'office'];
        let momStage = 0; // Index in the momPath array
        let momDifficulty = 5; // Lower = harder (moves more often)

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameActive = true;
            
            // Start Timers
            // 1 in-game hour = 60 seconds (60000ms)
            clockTimer = setInterval(updateClock, 60000); 
            // Power drains every few seconds based on usage
            powerTimer = setInterval(drainPower, 3000);
            // Mom AI calculates a move every 5 seconds
            momAITimer = setInterval(moveMom, 5000);

            switchCam('cam1'); // Default camera
            updateUI();
        }

        function updateClock() {
            if (!gameActive) return;
            timeHour++;
            let displayTime = timeHour === 0 ? 12 : timeHour;
            document.getElementById('time-display').innerText = displayTime + ":00 AM";

            if (timeHour >= 6) {
                winGame();
            }
        }

        function updateUsage() {
            usage = 1; // Base usage
            if (doorClosed) usage++;
            if (lightOn) usage++;
            if (camerasUp) usage++;

            let usageStr = "[";
            for(let i=0; i<4; i++) {
                usageStr += (i < usage) ? "|" : " ";
            }
            usageStr += "]";
            
            const usageEl = document.getElementById('usage-display');
            usageEl.innerText = "Usage: " + usageStr;
            
            // Color code usage
            if(usage === 1) usageEl.style.color = "#0f0"; // Green
            if(usage === 2) usageEl.style.color = "#ff0"; // Yellow
            if(usage >= 3) usageEl.style.color = "#f00";  // Red
        }

        function drainPower() {
            if (!gameActive) return;
            // Drain power based on usage level
            power -= (usage * 0.2); 
            if (power <= 0) {
                power = 0;
                powerOutage();
            }
            document.getElementById('power-display').innerText = "Power left: " + Math.floor(power) + "%";
        }

        // --- Player Controls ---

        function toggleDoor() {
            if (power <= 0) return;
            doorClosed = !doorClosed;
            const btn = document.getElementById('door-btn');
            if (doorClosed) {
                btn.innerText = "DOOR: CLOSED";
                btn.classList.add('active');
            } else {
                btn.innerText = "DOOR: OPEN";
                btn.classList.remove('active');
            }
            updateUsage();
        }

        function toggleLight() {
            if (power <= 0 || camerasUp) return;
            lightOn = !lightOn;
            const btn = document.getElementById('light-btn');
            const office = document.getElementById('office');
            
            if (lightOn) {
                btn.innerText = "LIGHT: ON";
                btn.classList.add('active');
                office.classList.add('light-on');
                checkDoorway();
            } else {
                btn.innerText = "LIGHT: OFF";
                btn.classList.remove('active');
                office.classList.remove('light-on');
            }
            updateUsage();
        }

        function toggleCameras() {
            if (power <= 0) return;
            camerasUp = !camerasUp;
            const camSystem = document.getElementById('camera-system');
            const toggleBtn = document.getElementById('toggle-cams');
            
            if (camerasUp) {
                camSystem.style.display = 'block';
                toggleBtn.innerText = "[ v ] Close Cameras [ v ]";
                // Turn off office light automatically when cams go up
                if(lightOn) toggleLight(); 
            } else {
                camSystem.style.display = 'none';
                toggleBtn.innerText = "[ ^ ] Open Cameras [ ^ ]";
            }
            renderMomOnCamera();
            updateUsage();
        }

        function switchCam(camId) {
            currentCam = camId;
            document.getElementById('camera-view').style.backgroundImage = `url('${rooms[camId].img}')`;
            
            // Update button styles
            document.querySelectorAll('.cam-btn').forEach(btn => btn.classList.remove('active-cam'));
            event.target.classList.add('active-cam');

            renderMomOnCamera();
        }

        // --- AI Movement System ---



function moveMom() {
    if (!gameActive) return;

    let moveChance = Math.floor(Math.random() * 10); 
    if (moveChance > momDifficulty) {
        const camView = document.getElementById('camera-view');

        // Initial Dip
        setTimeout(() => {
            camView.style.filter = "brightness(10%) grayscale(100%)";
            
            // The White Flash
            setTimeout(() => {
                camView.style.filter = "brightness(1000%) grayscale(100%)"; 
                
                // Logic: If she is in Hallway (cam6), move to Door (Peek phase)
                if (momPath[momStage] === 'cam6') {
                    momStage++; 
                    
                    // JUMPSCARE TIMER: 3.5 seconds after leaving hallway
                    setTimeout(() => {
                        if (momPath[momStage] === 'door' && !doorClosed) {
                            triggerJumpscare();
                        }
                    }, 3500); 

                } else if (momPath[momStage] === 'door') {
                    // If door was shut, she teleports back to Backyard (cam5)
                    if (doorClosed) momStage = 0; 
                } else {
                    momStage++;
                }

                renderMomOnCamera();

                // Fade back from white
                setTimeout(() => {
                    camView.style.filter = "brightness(40%) grayscale(100%)";
                    setTimeout(() => {
                        camView.style.filter = "grayscale(100%) brightness(50%) contrast(150%)";
                    }, 150);
                }, 100);

            }, 2000); 
        }, 100); 
    }
}
function checkDoorway() {
    const peekImg = document.getElementById('mom-peek');
    
    // If she is at the door and the light is on, show her silhouette
    if (momPath[momStage] === 'door' && lightOn) {
        peekImg.style.display = 'block';
    } else {
        peekImg.style.display = 'none';
    }
}
        function renderMomOnCamera() {
            const momImg = document.getElementById('mom-graphic');
            // If Mom is in the current camera
            if (momPath[momStage] === currentCam) {
                momImg.style.display = 'block';
                // Random positioning REMOVED. She is now static and centered.
                momImg.style.top = '0';
                momImg.style.left = '0';
            } else {
                momImg.style.display = 'none';
            }
        }


        // --- Game Ending States ---

        function powerOutage() {
            // Everything turns off. Mom comes to get you.
            if(camerasUp) toggleCameras();
            document.getElementById('office').style.filter = "brightness(5%)"; // Pitch black
            document.getElementById('controls-layer').style.display = 'none';
            
            // Wait 5 seconds in the dark, then jumpscare
            setTimeout(() => {
                triggerJumpscare();
            }, 5000);
        }

function triggerJumpscare() {
    if (!gameActive) return;
    gameActive = false;
    
    // Clear all game timers immediately
    clearInterval(clockTimer);
    clearInterval(powerTimer);
    clearInterval(momAITimer);
    
    // Show the jumpscare screen instantly
    const jumpScreen = document.getElementById('jumpscare-screen');
    jumpScreen.style.display = 'flex';
    
    // Optional: Add a high-pitched screen shake effect
    jumpScreen.style.animation = "shake 0.05s infinite"; 
}

        function winGame() {
            gameActive = false;
            clearInterval(clockTimer);
            clearInterval(powerTimer);
            clearInterval(momAITimer);

            document.getElementById('win-screen').style.display = 'flex';
        }

    </script>
</body>
</html>
